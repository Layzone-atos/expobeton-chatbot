# ═══════════════════════════════════════════════════════════════════════
# ExpoBeton RDC — Rasa Stories & Rules for Registration Flow
# ═══════════════════════════════════════════════════════════════════════
# Merge into your existing data/stories.yml and data/rules.yml
# ═══════════════════════════════════════════════════════════════════════

# ─── RULES (data/rules.yml) ──────────────────────────────────────────
# Rules are deterministic — they override stories when conditions match.
# Copy this section into your data/rules.yml file.

version: "3.1"

rules:
  # --- Registration form activation ---
  - rule: Activate registration form
    steps:
      - intent: register
      - action: registration_form
      - active_loop: registration_form

  # --- Registration form completion ---
  - rule: Submit registration when form complete
    condition:
      - active_loop: registration_form
    steps:
      - action: registration_form
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_submit_registration

  # --- Ambassador form activation ---
  - rule: Activate ambassador form
    steps:
      - intent: apply_ambassador
      - action: ambassador_form
      - active_loop: ambassador_form

  # --- Ambassador form completion ---
  - rule: Submit ambassador when form complete
    condition:
      - active_loop: ambassador_form
    steps:
      - action: ambassador_form
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_submit_ambassador

  # --- Show categories ---
  - rule: Show registration categories
    steps:
      - intent: show_categories
      - action: action_show_categories

  # --- Allow user to stop any form ---
  - rule: User stops registration form
    condition:
      - active_loop: registration_form
    steps:
      - intent: stop
      - action: action_deactivate_loop
      - active_loop: null

  - rule: User stops ambassador form
    condition:
      - active_loop: ambassador_form
    steps:
      - intent: stop
      - action: action_deactivate_loop
      - active_loop: null



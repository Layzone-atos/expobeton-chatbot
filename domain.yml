slots:
  person:
    type: text
    influence_conversation: false
    mappings:
    - type: from_entity
      entity: person
  # Tracks whether the bot has proposed registration and is waiting for
  # the user to confirm (affirm) or decline (deny) before activating the form.
  registration_pending:
    type: bool
    influence_conversation: true
    mappings:
      - type: custom
  # Registration slots
  reg_company:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: registration_form
            requested_slot: reg_company
  reg_contact_name:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: registration_form
            requested_slot: reg_contact_name
  reg_email:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: registration_form
            requested_slot: reg_email
  reg_phone:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: registration_form
            requested_slot: reg_phone
  reg_phone_prefix:
    type: text

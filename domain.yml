version: "3.1"

imports:
  - domain/general/
  - domain/system/patterns/

intents:
  - greet
  - goodbye
  - help
  - show_faqs
  - feedback
  - human_handoff
  - end_conversation
  - ask_event_dates
  - ask_about_expobeton
  - ask_event_location
  - ask_event_theme
  - ask_about_people
  - ask_general_question
  - ask_why_kalemie
  - ask_urban_development
  - ask_city_population

entities:
  - person

slots:
  person:
    type: text
    influence_conversation: false
    mappings:
    - type: from_entity
      entity: person

responses:
  utter_greet:
    - text: "Bonjour ! Comment puis-je vous aider aujourd'hui ?"
  utter_goodbye:
    - text: "Au revoir ! Passez une excellente journée."
  utter_help:
    - text: "Je suis l'assistant Expobeton. Je peux vous aider avec des informations sur nos services."
  utter_show_faqs:
    - text: "Voici nos questions fréquemment posées :"
  utter_feedback:
    - text: "Merci pour votre feedback !"
  utter_human_handoff:
    - text: "Je vais vous mettre en contact avec un agent humain."
  utter_end_conversation:
    - text: "Merci pour notre conversation. N'hésitez pas à revenir si vous avez d'autres questions."
  utter_about_expobeton:
    - text: "ExpoBeton RDC est le salon international de la construction, des infrastructures et du développement urbain en République Démocratique du Congo. C'est un forum annuel qui crée un espace de réflexion et de partenariat pour rebâtir les villes congolaises et soutenir la croissance économique."
  utter_event_dates:
    - text: "La prochaine édition (11ème) d'ExpoBeton RDC aura lieu du 15 au 18 avril 2026 à Kalemie, Province du Tanganyika. Cette édition est entièrement dédiée à Kalemie en tant que capitale du lithium et carrefour stratégique des corridors africains."
  utter_event_location:
    - text: "La prochaine édition d'ExpoBeton RDC se tiendra à Kalemie, Province du Tanganyika. Kalemie est la capitale du lithium pour la RDC et une porte d'entrée stratégique vers les corridors africains."
  utter_event_theme:
    - text: "Le thème de l'édition 2026 (11ème) est : 'KALEMIE, CAPITALE DU LITHIUM ET CARREFOUR STRATÉGIQUE AU COEUR DES CORRIDORS AFRICAINS DU SUD, DE L'EST, DE L'OUEST'. Cette édition est entièrement dédiée à la ville de Kalemie dans la province du Tanganyika."
  utter_why_kalemie:
    - text: "ExpoBeton 2026 se tiendra à Kalemie car cette ville émerge comme pilier incontournable de la transformation du Grand Katanga. Kalemie est la capitale du lithium pour la RDC grâce aux gisements de Manono (environ 400 millions de tonnes de réserves). Elle possède un port sur le lac Tanganyika qui est une porte d'entrée stratégique pour les corridors Est, Sud et Ouest, reliant la Tanzanie, la Zambie et l'Angola."
  utter_urban_development:
    - text: "🏙️ **Développement urbain et ExpoBeton RDC:**\n\n🏛️ **Mission d'ExpoBeton:**\nPromouvoir les infrastructures, la construction et le développement urbain en RDC pour rebâtir les villes congolaises et soutenir la croissance économique.\n\n🛣️ **Défis urbains majeurs:**\n• Congestion urbaine (Kinshasa: 15M+ habitants)\n• Déficit de logements (2M unités manquantes)\n• Infrastructures vieillissantes\n• Assainissement et gestion des déchets\n\n💡 **Solutions promues par ExpoBeton:**\n• Partenariats publics-privés (PPP)\n• Cités satellites et décongestio\n• Modernisation des infrastructures\n• Zones économiques spéciales (ZES)\n\n🏛️ **Impact:**\nCréation du Ministère de la Politique de la Ville (2024) suite aux recommandations d'ExpoBeton."
  utter_city_population:
    - text: "📊 **Populations des villes du Grand Katanga (estimations 2024):**\n\n🏙️ **Kinshasa:** ~17 millions d'habitants\n🏭 **Lubumbashi:** ~2,5 millions d'habitants\n⛏️ **Kolwezi:** ~500 000 habitants\n⛵ **Kalemie:** ~200 000 habitants\n\nℹ️ *Ces chiffres sont des estimations basées sur les données de l'ONU et des rapports gouvernementaux. Les chiffres officiels peuvent varier.*"

actions:
  - action_greet_personalized
  - action_human_handoff
  - action_show_faqs
  - action_feedback
  - action_end_conversation
  - action_answer_and_suggest
  - action_answer_expobeton
  - utter_greet
  - utter_goodbye
  - utter_help
  - utter_show_faqs
  - utter_feedback
  - utter_human_handoff
  - utter_end_conversation
  - utter_why_kalemie
  - utter_urban_development
  - utter_city_population

forms: {}

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
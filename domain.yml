version: "3.1"

imports:
  - domain/general/
  - domain/system/patterns/

intents:
  - greet
  - goodbye
  - ask_how_are_you
  - help
  - show_faqs
  - feedback
  - human_handoff
  - end_conversation
  - ask_event_dates
  - ask_about_expobeton
  - ask_event_location
  - ask_event_theme
  - ask_about_people
  - ask_general_question
  - ask_why_kalemie
  - ask_urban_development
  - ask_city_population
  - ask_program
  - ask_speakers
  - ask_registration
  - ask_corridors
  - ask_lithium
  - ask_edition_10
  - ask_objectives
  - ask_partners
  - ask_tourism_culture
  - ask_capacity
  - register
  - apply_ambassador
  - show_categories
  - ask_vip_pass
  # Exemples hors-domaine ajoutés dans data/nlu.yml (recettes, culture générale…)
  # pour borner DIET : sans eux, une question inconnue partait sur l'intention
  # entraînée la plus proche (« recette… sans four » → ask_event_location).
  - nlu_fallback
  - affirm
  - deny
  - thank_you
  - dont_understand
  - ask_media_press
  # Déclaré ici et non seulement dans data/nlu.yml : le Dockerfile exécute
  # « rasa train » pendant la construction de l'image. Un intent présent dans les
  # données d'entraînement mais absent du domaine fait échouer cette étape, donc
  # échouer le déploiement Railway — pas seulement dégrader la classification.
  - ask_access_badge
  - restart_form
  - inform
  - provide_company
  - provide_name
  - provide_email
  - provide_phone
  - provide_country
  - provide_city
  - provide_category
  - provide_payment
  - stop
  - registration_review

entities:
  - person
  - company_name
  - person_name
  - email
  - phone_number
  - country
  - city
  - category
  - payment_method
  - sponsor_level
  - stand_type
  - gender
  - think_tank_choice

slots:
  person:
    type: text
    influence_conversation: false
    mappings:
    - type: from_entity
      entity: person
  # Tracks whether the bot has proposed registration and is waiting for
  # the user to confirm (affirm) or decline (deny) before activating the form.
  registration_pending:
    type: bool
    influence_conversation: true
    mappings:
      - type: custom
  # Registration slots
  reg_company:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: registration_form
            requested_slot: reg_company
  reg_contact_name:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: registration_form
            requested_slot: reg_contact_name
  reg_email:
    type: text
    influence_conversation: false
    mappings:

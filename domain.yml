responses:
  utter_greet:
    - text: "Bonjour ! Comment puis-je vous aider aujourd'hui ?"
  utter_goodbye:
    - text: "Au revoir ! Passez une excellente journée."
  utter_deny:
    - text: "D'accord, pas de souci ! N'hésitez pas si vous avez d'autres questions sur ExpoBeton RDC. Je suis là pour vous aider ! 😊"
  utter_youre_welcome:
    - text: "Avec plaisir ! 😊 Je reste à votre disposition pour toute autre question sur ExpoBeton RDC 2026."
    - text: "Je vous en prie ! 🙏 N'hésitez pas si vous avez besoin d'autres informations sur le salon."
    - text: "De rien ! 😊 C'est un plaisir de vous aider. Avez-vous d'autres questions sur ExpoBeton RDC ?"
  utter_dont_understand:
    - text: "Pas de souci, je vais reformuler. 😊\n\n💡 Vous pouvez à tout moment :\n• Taper **« catégories »** pour revoir les options d'inscription\n• Taper **« dates »** pour les dates de l'événement\n• Taper **« recommencer »** pour reprendre depuis le début\n• Taper **« contact humain »** pour parler à notre équipe\n\nQue souhaitez-vous faire ?"
  utter_media_press:
    - text: "📰 Bonjour ! Pour les **journalistes, médias et créateurs de contenu**, ExpoBeton RDC propose une **accréditation presse gratuite** qui inclut :\n\n• Accès complet aux 4 jours de l'événement\n• Salle de presse dédiée\n• Interviews avec les officiels et exposants\n• Kit média (dossier de presse, visuels HD)\n\n📧 Envoyez votre demande d'accréditation à : **info@expobetonrdc.com** (objet : **Accréditation presse**)\n📋 À joindre : carte de presse ou justificatif, lien de votre chaîne/site, sujet de couverture envisagé.\n\n👉 Souhaitez-vous aussi vous inscrire comme **Participant Simple** (gratuit) en attendant ? Tapez **« oui »** ou **« je veux m'inscrire »**."
  utter_access_badge:
    - text: "🎫 **Obtenir votre badge d'accès — ExpoBeton RDC 2026**\n\nLe badge est un **titre d'accès au format PDF**, personnalisé selon votre catégorie, muni d'un **code à usage unique** scanné à l'entrée.\n\n**Procédure :**\n1️⃣ Être **inscrit** (formulaire du site, chatbot ou tunnel de souscription).\n2️⃣ Pour les catégories payantes (Sponsor, Exposant, VIP) : **règlement validé**. Le **Participant Simple** est gratuit, aucun règlement n'est requis.\n3️⃣ Le badge PDF est **envoyé par e-mail** à l'adresse indiquée lors de l'inscription, une fois le dossier validé.\n4️⃣ **Vérifiez vos spams / courriers indésirables.**\n\n📮 **Badge non reçu ?** Écrivez à **info@expobetonrdc.com** en précisant :\n• votre **nom complet** utilisé à l'inscription,\n• l'**adresse e-mail** d'inscription,\n• votre **numéro de référence** EXPOBETON-2026-… si vous l'avez.\nNotre équipe peut vous **renvoyer le badge**.\n\n📱 **Le jour J :** présentez le badge imprimé ou sur votre mobile, il sera scanné. Il est **nominatif** et un badge scanné n'est plus réutilisable. Tout changement de participant se demande à info@expobetonrdc.com avant l'événement.\n\n💳 **Paiement par virement ou chèque :** le badge est émis après confirmation de l'encaissement. Si vous avez reçu un **lien personnel de reprise de règlement**, suivez-le : votre inscription est déjà enregistrée, il n'y a rien à ressaisir.\n\n📰 *Vous cherchez plutôt une **accréditation presse** (journalistes, médias, créateurs de contenu) ? Tapez **« accréditation presse »**.*"
  utter_restart_form_confirm:
    - text: "🔄 D'accord, j'annule l'inscription en cours. Vos informations saisies sont effacées. Tapez **« je veux m'inscrire »** quand vous serez prêt à recommencer."
  utter_handoff_offer:
    - text: "On dirait que la question n'est pas claire pour vous. 🤝\n\n👉 Souhaitez-vous qu'un membre de notre équipe vous contacte directement par email ? Vous pouvez aussi écrire à **info@expobetonrdc.com** ou continuer en tapant votre choix."
  utter_registration_declined:
    - text: "Pas de souci ! 😊 Je reste à votre disposition. N'hésitez pas à me poser d'autres questions sur ExpoBeton RDC, ou tapez « je veux m'inscrire » quand vous serez prêt à commencer l'inscription."
  utter_how_are_you:
    - text: "Je vais très bien, merci de demander ! 😊 Et vous, comment allez-vous ? Que souhaitez-vous savoir sur ExpoBeton RDC ?"
  utter_help:
    - text: "Je suis l'assistant Expobeton. Je peux vous aider avec des informations sur nos services."
  utter_show_faqs:
    # L'ancien texte (« Voici nos questions fréquemment posées : ») n'annonçait
    # aucune FAQ — impasse pour l'utilisateur. Liste réelle, alignée sur les
    # faits canoniques de la 12ème édition (docs/00_canonical_*).
    - text: "📋 **FAQ — ExpoBeton RDC 2026 (12ème édition)**\n\n• 📅 **Quand ?** Du **07 au 10 octobre 2026** (4 jours)\n• 📍 **Où ?** Kinshasa — The Grand Residence, Galerie La Fontaine (Gombe)\n• 🎯 **Thème ?** « Kinshasa, Locomotive de la Transformation des Villes de la RDC »\n• 📝 **Comment participer ?** Tapez « je veux m'inscrire » (Participant Simple **gratuit**) ou « catégories » pour toutes les offres\n• 🌟 **Pass Participant VIP ?** Pass unique **300 $ les 4 jours** — souscription en ligne : https://expobetonrdc.com/sponsor/vip-participant.php\n• 🏆 **Sponsors & Exposants :** Platinum 40.000 $ · Gold 20.000 $ · Bronze 15.000 $ · Silver 10.000 $ · Stand 3×3m 5.000 $ · Stand 2×3m 3.500 $\n• 🎓 **Concours Jeunesse Horizon 2050** — demandez « concours jeunesse »\n• 📧 **Contact :** info@expobetonrdc.com\n\n💬 Posez-moi votre question, je suis là pour vous guider !"
  utter_feedback:
    - text: "Merci pour votre feedback !"
  utter_human_handoff:
    - text: "Je vais vous mettre en contact avec un agent humain."
  utter_end_conversation:
    - text: "Merci pour notre conversation. N'hésitez pas à revenir si vous avez d'autres questions."
  utter_about_expobeton:
    - text: "ExpoBeton RDC est le salon international de la construction, des infrastructures, du développement des villes, des corridors et des zones économiques spéciales en RDC. Créé en 2016, c'est un forum annuel de référence. La **12ème édition** se tiendra du **07 au 10 octobre 2026 à Kinshasa**, à La Grande Résidence — Galerie La Fontaine, sous le thème « Kinshasa, Locomotive de la Transformation des Villes de la RDC ». (La 11ème édition s'est tenue dans le Grand Katanga — Lubumbashi, avec des étapes satellites à Kalemie et Kolwezi.)\n\n💡 Le nom « ExpoBeton » symbolise le rendez-vous de référence des acteurs du béton, de la construction, des infrastructures et du développement urbain en RDC."
  utter_event_dates:
    - text: "La **12ème édition** d'ExpoBeton RDC se tiendra du **07 au 10 octobre 2026** (4 jours) à **Kinshasa**, à The Grand Residence — Galerie La Fontaine (croisement des avenues des Cliniques et Batetela, commune de la **Gombe**).\n\n🕘 Horaires sur le site : **09h00 – 15h30** · Activités hors site : **16h00 – 19h15** (06-11 octobre).\n\n📅 **Programme :**\n• Jour 1 (Mer 07 oct) : Journée Portes Ouvertes, Touristique et Culturelle\n• Jour 2 (Jeu 08 oct) : Cérémonie d'ouverture officielle + Panels Habitat & Territoire\n• Jour 3 (Ven 09 oct) : Corridors transfrontaliers, ZES, Énergie\n• Jour 4 (Sam 10 oct) : Jeunesse & Innovation + Cérémonie de clôture"
  utter_event_location:
    - text: "📍 **Lieu précis — ExpoBeton RDC 2026 (12ème édition) :**\n\nLe salon se tient à **The Grand Residence — Galerie La Fontaine**, au **croisement des avenues des Cliniques et Batetela**, commune de la **Gombe**, à **Kinshasa**.\n\n🏛️ C'est là que se déroulent l'exposition, les conférences, les panels, les rendez-vous B2B/B2G et les cérémonies d'ouverture et de clôture.\n\n🏢 **Secrétariat / adresse administrative** d'EXPO BÉTON ASBL : **07, avenue de l'OUA, commune de Ngaliema**, Kinshasa.\n⚠️ Attention : le secrétariat n'est **pas** le lieu du salon.\n\n🕘 **Horaires sur le site :** 09h00 – 15h30.\n🌆 **Activités hors site :** 16h00 – 19h15, du 06 au 11 octobre 2026.\n\n📅 **Dates :** du **07 au 10 octobre 2026** (4 jours)."
  utter_event_theme:
    - text: "Le thème de la **12ème édition (2026)** est : « **Kinshasa, Locomotive de la Transformation des Villes de la RDC** ». Cette édition est consacrée au rôle moteur de Kinshasa dans la modernisation urbaine, les infrastructures et le développement des villes congolaises."
  utter_why_kalemie:
    - text: "ℹ️ **Kalemie** a accueilli une étape satellite de la **11ème édition (avril 2026)** dans le volet Grand Katanga. Elle émerge comme pilier de la transformation du Grand Katanga :\n\n⛏️ **Capitale du lithium** : Gisements de Manono (~400M tonnes de réserves, l'un des plus grands au monde), projets KoBold Metals (soutenu par Bill Gates et Jeff Bezos), Zijin Mining\n🚢 **Port stratégique** : Sur le lac Tanganyika, porte d'entrée du corridor central Dar es-Salaam–Kalemie–Kisangani\n⚡ **Énergie** : Station Mpiana-Mwanga (40 MW, expansion à 148 MW prévue)\n🌍 **Carrefour des corridors** : Est (Tanzanie), Sud (Zambie), Ouest (Angola/Lobito)"
  utter_urban_development:
    - text: "🏙️ **Développement urbain et ExpoBeton RDC:**\n\n🏛️ **Mission d'ExpoBeton:**\nPromouvoir les infrastructures, la construction et le développement urbain en RDC pour rebâtir les villes congolaises et soutenir la croissance économique.\n\n🛣️ **Défis urbains majeurs:**\n• Congestion urbaine (Kinshasa: 15M+ habitants)\n• Déficit de logements (2M unités manquantes)\n• Infrastructures vieillissantes\n• Assainissement et gestion des déchets\n\n💡 **Solutions promues par ExpoBeton:**\n• Partenariats publics-privés (PPP)\n• Cités satellites et décongestio\n• Modernisation des infrastructures\n• Zones économiques spéciales (ZES)\n\n🏛️ **Impact:**\nCréation du Ministère de la Politique de la Ville (2024) suite aux recommandations d'ExpoBeton."
  utter_city_population:
    - text: "📊 **Populations des principales villes de la RDC (estimations 2024):**\n\n🏙️ **Kinshasa:** ~17 millions d'habitants\n🏭 **Lubumbashi:** ~2,5 millions d'habitants\n⛏️ **Kolwezi:** ~500 000 habitants\n⛵ **Kalemie:** ~200 000 habitants\n\nℹ️ *Ces chiffres sont des estimations basées sur les données de l'ONU et des rapports gouvernementaux. Les chiffres officiels peuvent varier.*"
  utter_program:
    - text: "📅 **Programme ExpoBeton RDC 2026 – 12ème Édition (07-10 octobre, Kinshasa)**\n\n**Jour 1 – Mer 07 oct** : Journée Portes Ouvertes, Touristique et Culturelle\n• 10h-17h : Visites expositions, danses traditionnelles, concerts, pêche lacustre\n• 17h : Cocktail d'accueil\n\n**Jour 2 – Jeu 08 oct** : Ouverture officielle & Transformation urbaine\n• 09h : Ouverture officielle (Président de la République)\n• Panels : Habitat, Aménagement du Territoire, Loi Foncière\n• 16h-19h : Networking B2B/B2G\n\n**Jour 3 – Ven 09 oct** : Corridors, ZES & Énergie\n• Panels : CIRGL, ZES, Corridor Central, Agriculture, Énergie\n• 18h30 : Dîner networking B2B\n\n**Jour 4 – Sam 10 oct** : Jeunesse & Innovation\n• Formation, entrepreneuriat, pitchs innovations\n• 15h : Clôture par la Première Ministre Judith Suminwa"
  utter_speakers:
    - text: "🎤 **Principaux intervenants ExpoBeton 2026 :**\n\n🏛️ **Ouverture :** SE M. le Président de la République\n🏛️ **Clôture :** SE Mme Judith Suminwa, Première Ministre\n\n**Ministres :** VPM Économie Daniel Mukoko Samba, Min. des Mines, Min. Intégration Régionale, Min. Urbanisme, Min. Aménagement du Territoire, Min. Commerce Extérieur, Min. Agriculture, Min. Ressources Hydrauliques, Justin Kalumba Mwanangongo (PME/Industrie)\n\n**Autres :** Gouverneur de Kinshasa, DG KoBold Metals, DG GECAMINES, DG SNEL, DG FPI, DGA Manono Lithium (Rex Basile Muyey), DG ARE (Mme Soraya AZIZ), CIRGL, BAD, Ambassadeurs de France, Belgique, USA\n\n**Modérateur :** Danny KAMBO"
  utter_capacity:
    - text: "🎟️ **Places et capacité — ExpoBeton RDC 2026 :**\n\nLe site de **The Grand Residence — Galerie La Fontaine** (Gombe, Kinshasa) offre des espaces d'exposition et des salles de conférences dimensionnés pour un salon international. L'audience attendue pour la 12ème édition est de **plus de 1 000 participants**.\n\n⚠️ Les places des **salles de conférences**, des **sessions B2B/B2G** et du **dîner networking** sont **limitées** et attribuées selon l'ordre des inscriptions.\n\n👉 Nous vous recommandons de vous inscrire tôt pour garantir votre place. Tapez **« je veux m'inscrire »** pour commencer."
  utter_registration:
    - text: "📝 **Inscription à ExpoBeton RDC 2026 :**\n\n**Qui peut participer ?** Professionnels, investisseurs, entreprises, étudiants, médias, universitaires, décideurs politiques.\n\n🛂 **Visa :** Une invitation officielle est fournie pour faciliter l'obtention de votre visa.\n📧 **Contact :** info@expobetonrdc.com\n💰 **Finances :** finance@expobetonrdc.com\n🕐 **Horaires :** Lundi-Vendredi, 08h-16h\n\n💬 **Souhaitez-vous vous inscrire maintenant ?** Je peux vous guider à travers le formulaire d'inscription directement ici ! Tapez simplement « je veux m'inscrire » pour commencer."
  utter_corridors:
    - text: "🌍 **Les Corridors Africains et ExpoBeton 2026 :**\n\n🔵 **Corridor Est** : Lac Tanganyika → Tanzanie (Dar es-Salaam) → Kenya (Mombasa)\n🟢 **Corridor Sud** : Lubumbashi → Kolwezi → Zambie → Zimbabwe → Afrique du Sud (chemin de fer TAZARA)\n🟠 **Corridor Ouest** : Kolwezi → Angola (Lobito/Benguela) – 5,5 milliards USD d'investissement UE/USA\n🔴 **Corridor Central** : Dar es-Salaam → Burundi → Kalemie → Kindu → Kisangani\n\nKinshasa, capitale et poumon économique de la RDC, est le point de convergence stratégique de ces corridors pour la 12ème édition."
  utter_lithium:
    - text: "⛏️ **Lithium et Kalemie (volet 11ème édition — Grand Katanga) :**\n\nKalemie est la capitale du lithium de la RDC grâce aux gisements de Manono (~400 millions de tonnes de réserves, l'un des plus grands dépôts au monde).\n\n**Projets phares :**\n• Manono Northeast Lithium Project (Zijin Mining)\n• Manono-Kitolo (AVZ Minerals/Cominière)\n• 7 permis d'exploration KoBold Metals (août 2025) – soutenus par Bill Gates et Jeff Bezos\n\n**Infrastructure :**\n• Route Manono-Kalemie (100 km) prioritaire pour l'exportation\n• Station hydroélectrique Mpiana-Mwanga (40 MW → 148 MW prévu)\n\nLe lithium est essentiel pour les batteries des véhicules électriques et le stockage d'énergie."
  utter_edition_10:
    - text: "📋 **10ème Édition – ExpoBeton RDC 2025 (TERMINÉE)**\n\n📅 Dates : 8-11 octobre 2025\n📍 Lieu : Centre Culturel et Artistique, Kinshasa\n🎯 Thème : « 100 milliards USD pour rebâtir la RDC post-conflit »\n\n**Résultats :**\n• +5 000 participants\n• 2,3 milliards USD d'engagements\n• Formation de 500 professionnels\n• 3,5 millions d'impressions réseaux sociaux\n• Projet « 100 Ponts pour la RDC » annoncé\n\nLa **11ème édition** s'est tenue dans le Grand Katanga (Lubumbashi, avec étapes satellites à Kalemie et Kolwezi) en avril 2026. La prochaine édition (**12ème**) aura lieu du **07 au 10 octobre 2026 à Kinshasa**."
  utter_objectives:
    - text: "🎯 **Objectifs de la 12ème Édition (Kinshasa) :**\n\n1️⃣ **Transformation urbaine** – Positionner Kinshasa comme locomotive de la modernisation des villes congolaises\n2️⃣ **Infrastructures & logement** – Répondre au déficit de logements et moderniser les réseaux urbains\n3️⃣ **Attirer des investissements** – PPP, financement des grands projets urbains, énergie\n4️⃣ **Durabilité et inclusion** – Principes ESG, formation des jeunes via Club BTP et CMA\n5️⃣ **Échanges et partenariats** – Sessions B2B, B2G, panels, réseau post-événement\n\n**Résultats attendus :** 50 000 emplois d'ici 2030, +500 opportunités d'affaires, +10% d'exportations minières transformées"
  utter_partners:
    - text: "🤝 **Partenaires ExpoBeton RDC 2026 :**\n\n🏛️ **Institutionnels :** Présidence, Gouvernement, Ministères (Intégration Régionale, Économie, Mines, Transports, Commerce, Urbanisme, ITPR, Industrie), Sénat, Assemblée Nationale\n\n⚙️ **Opérationnels :** CP&DC, RUBIS, Gouvernement provincial de Kinshasa et provinces partenaires\n\n🏭 **Secteur privé :** Sociétés minières, cimenteries, BTP, bureaux d'études, immobilier, logistique\n\n🏦 **Institutions :** DGDCI, DGDA, DGI, OCC, SNEL, ANAPI, SNCC, GECAMINES, FPI, FEC\n\n🎓 **Universités :** IBTP, ISAU, ISTA, ISIPA, ISC et universités partenaires"
  utter_tourism_culture:
    - text: "🎭 **Tourisme et Culture – ExpoBeton 2026 :**\n\nLe **Jour 1 (Mercredi 07 octobre)** est une Journée Portes Ouvertes gratuite :\n• Danses et animations culturelles de Kinshasa\n• Concerts locaux\n• Expositions d'artisans\n• Expositions d'artisans et créateurs\n• Spectacles de rue\n• Stands gourmands\n\n🏙️ **Kinshasa** : mégapole vibrante sur les rives du fleuve Congo, riche d'une scène culturelle et musicale mondialement reconnue (rumba congolaise)\n\n🎉 Un spectacle culturel de la jeunesse clôturera l'événement le Jour 4."

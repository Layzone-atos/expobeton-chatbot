<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpoBeton Chatbot</title>
    <link rel="stylesheet" href="/web/chat-widget.css">
    <style>
        /* Reset and base styles for iframe */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: transparent;
            overflow: hidden;
            /* CRITICAL: let clicks pass through the iframe to the host page */
            pointer-events: none;
        }

        /* Only the chat widget itself is interactive */
        #chat-widget,
        #chat-widget * {
            pointer-events: auto;
        }

        /* Ensure the chat widget is always visible */
        #chat-widget {
            position: fixed;
            bottom: 0;
            right: 0;
            z-index: 999999;
        }
    </style>
</head>
<body>
    <!-- Chat Widget Only (No demo content) -->
    <div id="chat-widget">
        <!-- Floating Chat Button -->
        <div id="chat-button" class="chat-button">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" width="28" height="28">
                <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
            </svg>
            <span class="notification-badge" id="notification-badge" style="display: none;">1</span>
        </div>

        <!-- Chat Window -->
        <div id="chat-window" class="chat-window" style="display: none;">
            <!-- Chat Header -->
            <div class="chat-header">
                <div class="chat-header-content">
                    <div class="bot-avatar">🤖</div>
                    <div class="chat-title">
                        <h3>Assistant ExpoBeton</h3>
                        <p class="chat-status">En ligne</p>
                    </div>
                </div>
                <button id="close-chat" class="close-button">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" width="24" height="24">
                        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                    </svg>
                </button>
            </div>

            <!-- User Info Form -->
            <div id="user-info-form" class="user-info-form">
                <div class="form-content">
                    <h3>👋 Bienvenue chez ExpoBeton RDC!</h3>
                    <p>Pour mieux vous servir, veuillez remplir ces informations:</p>
                    <p class="form-contact-note" style="font-size:12px;color:#475569;background:#f1f5f9;border-left:3px solid #0A2A66;padding:8px 10px;border-radius:6px;margin:0 0 12px 0;line-height:1.4;">
                        📞 Vos coordonnées permettront à l'équipe ExpoBeton de vous contacter pour vous tenir informé(e) des autres aspects de l'événement.
                    </p>
                    
                    <form id="user-form">
                        <div class="form-group">
                            <label for="user-name">Nom complet <span class="required">*</span></label>
                            <input type="text" id="user-name" name="name" required placeholder="Ex: Jean Dupont">
                        </div>
                        
                        <div class="form-group">
                            <label for="user-phone">Numéro de téléphone <span class="required">*</span></label>
                            <input type="tel" id="user-phone" name="phone" required pattern="[+0-9\s\-()]{6,}" placeholder="Ex: +243 XX XXX XXXX" title="Veuillez entrer un numéro de téléphone valide (au moins 6 chiffres, indicatif pays bienvenu).">
                        </div>
                        
                        <div class="form-group">
                            <label for="user-email">Email <span class="optional">(optionnel)</span></label>
                            <input type="email" id="user-email" name="email" placeholder="Ex: jean@example.com">
                        </div>
                        
                        <button type="submit" class="submit-button">
                            Commencer la conversation
                        </button>
                    </form>
                </div>
            </div>

            <!-- Chat Messages Container -->
            <div id="chat-messages" class="chat-messages" style="display: none;">
                <div id="messages-list" class="messages-list">
                    <!-- Messages will be added here dynamically -->
                </div>
            </div>

            <!-- Chat Input -->
            <div id="chat-input-container" class="chat-input-container" style="display: none;">
                <div class="chat-input-wrapper">
                    <input 
                        type="text" 
                        id="chat-input" 
                        class="chat-input" 
                        placeholder="Tapez votre message..."
                        autocomplete="off"
                    >
                    <button id="send-button" class="send-button">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" width="24" height="24">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                        </svg>
                    </button>
                </div>
                <div class="typing-indicator" id="typing-indicator" style="display: none;">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <div class="chat-actions">
                    <button id="end-conversation-button" class="end-conversation-button">
                        🏁 Terminer la conversation
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="/web/chat-widget.js"></script>
</body>
</html>

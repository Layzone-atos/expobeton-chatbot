            requested_slot: reg_history
  # Internal phase tracker for category sub-menus (not collected by form)
  _reg_category_phase:
    type: text
    influence_conversation: false
    mappings:
      - type: custom
  # Counts consecutive failed validations on the same slot (for handoff/help)
  _reg_validation_fails:
    type: float
    initial_value: 0
    influence_conversation: false
    mappings:
      - type: custom
  # Review form slot — set to "confirmed" when user types ok
  _reg_confirmed:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: registration_review_form
            requested_slot: _reg_confirmed
  # Tracks which field is being edited in the review summary
  _reg_edit_field:
    type: text
    influence_conversation: false
    mappings:
      - type: custom
  # Tracks locally selected files ("selected" or null)
